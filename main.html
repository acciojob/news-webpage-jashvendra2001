<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Webpage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>News Today</h1>
    </header>

    <main class="news-container">
        <section class="main-news">
            <h2>Breaking News</h2>
            <p>
                This is the main news story of the day. Stay updated with
                the latest events and important developments.
            </p>
        </section>

        <aside class="side-news">
            <h2>Latest News</h2>

            <article>
                <h3>News Story 1</h3>
                <p>Short description about the first news story.</p>
            </article>

            <article>
                <h3>News Story 2</h3>
                <p>Short description about the second news story.</p>
            </article>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 News Today</p>
    </footer>

</body>
</html>
